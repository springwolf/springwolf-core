import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'

    alias libs.plugins.spring.boot
    alias libs.plugins.cutterslade.analyze
}

dependencies {
    api project(":springwolf-asyncapi")
    api project(":springwolf-core")
    api project(":springwolf-bindings")
    permitUnusedDeclared project(":springwolf-bindings")
    compileOnly project(":springwolf-web")
    permitUsedUndeclared project(":springwolf-asyncapi")
    permitUsedUndeclared project(":springwolf-core")
    permitUsedUndeclared project(":springwolf-web")

    implementation libs.slf4j.api

    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    implementation libs.spring.context
    implementation libs.spring.core
    compileOnly libs.spring.web
    implementation libs.spring.boot
    implementation libs.spring.boot.autoconfigure
    implementation libs.spring.amqp
    implementation libs.spring.rabbit

    annotationProcessor libs.lombok
    compileOnly libs.lombok

    compileOnly libs.jspecify

    annotationProcessor libs.spring.boot.configuration.processor

    testAnnotationProcessor libs.lombok
    testCompileOnly libs.lombok

    testImplementation libs.jackson.databind

    testImplementation libs.assertj.core
    testImplementation libs.mockito.core

    testImplementation libs.spring.boot.test
    testImplementation libs.spring.beans
    testImplementation libs.spring.test

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter
    testRuntimeOnly libs.junit.plattform.launcher

    add("webTestImplementation", project())
    add("webTestImplementation", project(":springwolf-web"))
    add("webTestImplementation", libs.spring.web)
    add("webTestRuntimeOnly", libs.spring.boot.starter.webmvc)

    add("permitWebTestUnusedDeclared", project(":springwolf-asyncapi"))
    add("permitWebTestUnusedDeclared", project(":springwolf-bindings"))
    add("permitWebTestUnusedDeclared", project(":springwolf-web"))
    add("permitWebTestUnusedDeclared", libs.junit.jupiter)
    add("permitWebTestUnusedDeclared", libs.slf4j.api)
    add("permitWebTestUnusedDeclared", libs.spring.amqp)
}

jar {
    enabled = true
    archiveClassifier = ''
}
bootJar.enabled = false

java {
    withJavadocJar()
    withSourcesJar()
}

MavenPublication mavenJava = publishing.publications.getByName('mavenJava')
mavenJava.pom {
    name = 'springwolf-amqp'
    description = 'Automated JSON API documentation for AMQP (RabbitMQ) Listeners built with Spring'
}
