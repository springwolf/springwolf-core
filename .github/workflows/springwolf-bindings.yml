name: springwolf-bindings

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Check formatting (before running tests) on bindings
        run: ./gradlew -p springwolf-bindings spotlessCheck

      - name: Run unit tests
        run: ./gradlew -p springwolf-bindings test

      - name: Run build, check, analyzeDependencies on bindings
        run: ./gradlew -p springwolf-bindings build

      - name: Publish package
        if: github.ref == 'refs/heads/main'
        run: ./gradlew -p springwolf-bindings publish
        env:
          ORG_GRADLE_PROJECT_SNAPSHOT: true

          ORG_GRADLE_PROJECT_SIGNINGKEY: ${{secrets.ORG_GRADLE_PROJECT_SIGNINGKEY}}
          ORG_GRADLE_PROJECT_SIGNINGPASSWORD: ${{secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD}}

          ORG_GRADLE_PROJECT_MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
